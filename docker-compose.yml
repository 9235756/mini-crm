services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mini_crm_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/crm.db
      # Docker Desktop (Windows/macOS) не всегда пробрасывает события файловой системы
      # из примонтированной папки — включаем опрос, чтобы --reload срабатывал надёжно
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app/backend   # код: правки подхватываются без пересборки
      - ./data:/app/data         # база crm.db сохраняется между перезапусками
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
